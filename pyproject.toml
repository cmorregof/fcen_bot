[project]
name = "fcen-bot"
version = "0.1.0"
description = "Agente de Telegram que arma las actas de los comités asesores de la FCEN (UNAL Manizales)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "anthropic>=0.40.0",
    "python-docx>=1.1.0",
    "pillow>=10.3.0",
    "tzdata>=2024.1",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "qrcode[pil]>=7.4",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# El formateador ya controla el largo del código; los textos en español quedan largos.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
