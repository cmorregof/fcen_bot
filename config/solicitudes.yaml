# Rutas de decisión y umbrales de las solicitudes estudiantiles (servicio de actas).
#
# Lo edita la Vicedecanatura Académica. Cómo hacerlo: docs/solicitudes.md.
# Si este archivo falta o tiene un error, el servicio de actas no arranca y el
# registro dice qué línea revisar.
#
# El comité asesor NUNCA decide: solo recomienda APROBAR o NO APROBAR. Decide
# el Consejo de Facultad, el Consejo de Sede o el Consejo Superior, según el
# trámite.
#
# Instancias válidas en «decide»:
#   consejo_facultad | consejo_sede | consejo_superior | por_confirmar
#
# «normas» y «norma» son nombres de las normas transcritas literalmente en
# app/normativa/base.py (por ejemplo ACUERDO_008_ART_10). Aquí no se escribe
# texto de normas: si hace falta una norma nueva, primero se transcribe allí.
#
# Solo se llenó lo que dicen las normas literales de app/normativa/base.py.
# Lo demás queda «por_confirmar» hasta que lo confirme la Vicedecanatura.

umbrales:
  carga_minima:
    valor: 10
    norma: ACUERDO_008_ART_10
    nota: >-
      Pregunta abierta del Consejo (28-oct-2026): confirmar si el Acuerdo 230
      de 2026 modifica la carga mínima. Sin texto literal en el repositorio.
  semana_limite_asignaturas:
    valor: 10
    norma: ACUERDO_027_ART_1
  semana_limite_tdg_actividades:
    valor: 13
    norma: ACUERDO_027_ART_1
  semana_limite_traslado:
    valor: 7
    # El texto del Acuerdo 089 de 2014 aún no está transcrito en app/normativa.
    fuente: Acuerdo 089 de 2014, art. 2 (antes de la semana 7)
  jurados_minimo:
    valor: 6
    # La variable de entorno JURADOS_MINIMO, si está definida, tiene prioridad.
    fuente: instrucción del Consejo de Facultad, 28-oct-2026
  # Créditos disciplinares aprobados que exige cada programa para inscribir
  # Trabajo de Grado. Un programa que no aparece no tiene esta regla.
  tdg_creditos_disciplinares:
    ing_fisica:
      valor: 46
      norma: RES_CFCEN_060_ART_5

# Plazos para el indicador «casos fuera de plazo» (docs/indicadores.md), en
# días calendario. Están vacíos porque ninguna norma transcrita los fija:
# mientras sigan así, el indicador dice «sin plazo configurado» y no cuenta
# ningún caso. Para fijarlos, cambie «null» por un bloque como este:
#
#   comite:
#     dias: 15
#     fuente: <norma, circular o instrucción que fija el plazo>
plazos:
  # De la solicitud a la recomendación del comité asesor.
  comite: null
  # De la recomendación del comité a la decisión del Consejo (fecha del acta).
  consejo: null

# Línea única de estados de una solicitud (docs/flujo-solicitudes.md). Son
# decisiones de negocio que aún no confirma la Vicedecanatura; los valores
# reproducen lo que hacía MemorIA antes de la prerrevisión.
flujo:
  # true: el caso no entra al comité hasta que el programa lo marque procedente.
  prerrevision_obligatoria: false
  # true: un caso improcedente igual pasa por el comité, con la marca a la vista.
  # false: se queda en «improcedente» (cuenta en las métricas, no va al comité).
  improcedente_va_a_comite: true
  nota: Por confirmar con la Vicedecanatura Académica.

solicitudes:
  inscripcion_extemporanea:
    recomienda: comite_asesor
    decide: consejo_facultad
    acto: por_confirmar
    normas: [ACUERDO_350_ART_1_2, ACUERDO_027_ART_1]

  carga_minima:
    recomienda: comite_asesor
    decide: consejo_facultad
    acto: por_confirmar
    normas: [ACUERDO_008_ART_10]

  cancelacion:
