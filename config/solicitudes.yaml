    acto: por_confirmar
    normas: [RES_CFCEN_060_ART_5, ACUERDO_027_ART_1]
    nota: >-
      Lo confirma la Vicedecanatura Académica. Las normas citadas fijan
      requisitos y plazos, pero no dicen quién decide la inscripción ordinaria.

