name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy app/
      - run: uv run pytest -q

  # La misma suite contra Postgres: cada prueba en un esquema propio
  # (tests/conftest.py), más tests/test_postgres.py (migración y aislamiento).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memoria
          POSTGRES_PASSWORD: memoria
          POSTGRES_DB: memoria_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://memoria:memoria@localhost:5432/memoria_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # pg_dump/pg_restore para la prueba del respaldo en Drive (tests/test_drive.py).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client && pg_dump --version
      - run: uv sync --group dev
      - run: uv run pytest -q -rs
